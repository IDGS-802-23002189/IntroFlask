{% extends "cinepolisLayout.html" %}

{% block title %}Compra de Boletos{% endblock %}

{% block content %}

<div class="card shadow p-3" style="width: 100%; max-width: 900px;">

    <!-- Logo -->
    <div class="text-center mb-3">
        <img src="{{ url_for('static', filename='img/cine.jfif') }}" alt="Logo Cine" class="logo">
    </div>

    <h4 class="text-center mb-4">Compra de Boletos</h4>

    <form method="post">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" value="{{ nombre or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad de compradores</label>
            <input type="number" class="form-control" name="cantidad_compradores" min="1"
                value="{{ cantidad_compradores or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Tarjeta CINECO</label>
            <select class="form-select" name="tarjetaCineco">
                <option value="no">No</option>
                <option value="si">Sí</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Cantidad de boletos</label>
            <input type="number" class="form-control" name="cantidad_boletos" min="1"
                value="{{ cantidad_boletos or '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Valor a pagar</label>
            <input type="text" class="form-control" value="{{ total }}" disabled>

        </div>
        <div class="d-flex justify-content-between">
            <button type="submit" name="accion" value="procesar" class="btn btn-success">
                Procesar
            </button>
            <button type="submit" name="accion" value="salir" class="btn btn-danger">
                Salir
            </button>
        </div>

        <div class="">
            {{ mensaje }}
        </div>


    </form>

</div>

{% endblock %}
