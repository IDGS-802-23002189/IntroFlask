<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cinépolis{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background:
                linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)),
                url("/static/img/cine.jpeg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            color: white;
            font-family: Arial, sans-serif;
        }



        .cine-container {
            width: 900px;
            margin: auto;
            padding: 20px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 300px;
        }

        .box {
            border: 2px solid white;
            padding: 15px;
            margin-bottom: 20px;
        }

        legend {
            padding: 0 10px;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .actions {
            text-align: center;
        }

        .actions button {
            width: 120px;
            margin: 0 10px;
            font-weight: bold;
        }

        .radio-group {
            margin-top: 5px;
        }

        .form-check-label {
            margin-left: 4px;
        }
    </style>
</head>

<body>

    {% block content %}{% endblock %}

</body>

</html>
